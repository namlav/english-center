<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="bg-comm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="gold-comm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="shadow-comm" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" rx="12" fill="url(#bg-comm)" />

  <!-- Geometric Accents -->
  <circle cx="760" cy="50" r="140" fill="#818cf8" opacity="0.2" />
  <circle cx="560" cy="270" r="90" fill="#c084fc" opacity="0.15" />
  <circle cx="50" cy="270" r="80" fill="#3730a3" opacity="0.3" />

  <!-- Brand Pill -->
  <rect x="40" y="32" width="240" height="28" rx="14" fill="rgba(255, 255, 255, 0.15)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1" />
  <circle cx="56" cy="46" r="5" fill="#fef08a" />
  <text x="70" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">ENGLISH CENTER · BUSINESS ENGLISH</text>

  <!-- Main Title -->
  <text x="40" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="33" font-weight="900" fill="#ffffff" letter-spacing="-0.5">TIẾNG ANH GIAO TIẾP</text>
  <text x="420" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="33" font-weight="900" fill="url(#gold-comm)" letter-spacing="-0.5">1-KÈM-1</text>

  <!-- Subtitle -->
  <text x="40" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#e2e8f0">Thuyết trình, viết Email &amp; Phỏng vấn xin việc · Tự tin sau 3 tháng</text>

  <!-- Features Pills -->
  <g transform="translate(40, 165)">
    <rect x="0" y="0" width="145" height="32" rx="6" fill="rgba(255, 255, 255, 0.15)" />
    <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff">💼 Phỏng vấn &amp; CV</text>

    <rect x="155" y="0" width="145" height="32" rx="6" fill="rgba(255, 255, 255, 0.15)" />
    <text x="169" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff">✉️ Viết Email chuẩn</text>

    <rect x="310" y="0" width="130" height="32" rx="6" fill="rgba(255, 255, 255, 0.15)" />
    <text x="324" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff">🎙️ Họp &amp; Đàm phán</text>
  </g>

  <!-- Bottom CTA hint -->
  <text x="40" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#c7d2fe">🌟 Giảng viên bản ngữ &amp; Chuyên gia doanh nghiệp trực tiếp kèm</text>

  <!-- Right Visual / Target Badge -->
  <g transform="translate(540, 45)" filter="url(#shadow-comm)">
    <!-- Main Glass Card -->
    <rect x="0" y="0" width="220" height="210" rx="16" fill="rgba(255, 255, 255, 0.95)" />
    
    <!-- Header of Card -->
    <rect x="0" y="0" width="220" height="48" rx="16" fill="#312e81" />
    <rect x="0" y="32" width="220" height="16" fill="#312e81" />
    <text x="110" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="1">LỊCH HỌC LINH HOẠT</text>

    <!-- Center Icon / Graphic -->
    <circle cx="110" cy="115" r="46" fill="#ede9fe" />
    <text x="110" y="112" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28">🗣️</text>
    <text x="110" y="138" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#4338ca">PHẢN XẠ NHANH</text>

    <!-- Card Footer Tags -->
    <rect x="25" y="172" width="170" height="24" rx="12" fill="#f5f3ff" />
    <text x="110" y="188" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#6d28d9">TỰ CHỌN GIỜ HỌC 24/7</text>
  </g>
</svg>
