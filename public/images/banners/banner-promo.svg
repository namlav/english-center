<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <linearGradient id="bg-promo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="45%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="gold-promo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <linearGradient id="discount-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="shadow-promo" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="300" rx="12" fill="url(#bg-promo)" />

  <!-- Geometric Accents -->
  <circle cx="760" cy="50" r="140" fill="#fb7185" opacity="0.22" />
  <circle cx="560" cy="270" r="90" fill="#fda4af" opacity="0.15" />
  <circle cx="50" cy="270" r="80" fill="#4c0519" opacity="0.35" />

  <!-- Brand Pill -->
  <rect x="40" y="32" width="220" height="28" rx="14" fill="rgba(255, 255, 255, 0.15)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1" />
  <circle cx="56" cy="46" r="5" fill="#fde047" />
  <text x="70" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#f1f5f9" letter-spacing="0.5">ENGLISH CENTER · ƯU ĐÃI THÁNG</text>

  <!-- Main Title -->
  <text x="40" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="33" font-weight="900" fill="#ffffff" letter-spacing="-0.5">ƯU ĐÃI HỌC VIÊN MỚI</text>
  <text x="420" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="33" font-weight="900" fill="url(#gold-promo)" letter-spacing="-0.5">-30%</text>

  <!-- Subtitle -->
  <text x="40" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#ffe4e6">Áp dụng cho học viên đăng ký tài khoản &amp; đặt đơn khóa học hôm nay</text>

  <!-- Features Pills -->
  <g transform="translate(40, 165)">
    <rect x="0" y="0" width="145" height="32" rx="6" fill="rgba(255, 255, 255, 0.15)" />
    <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff">🎁 Tặng bộ tài liệu VIP</text>

    <rect x="155" y="0" width="145" height="32" rx="6" fill="rgba(255, 255, 255, 0.15)" />
    <text x="169" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff">⚡ Kích hoạt học ngay</text>

    <rect x="310" y="0" width="130" height="32" rx="6" fill="rgba(255, 255, 255, 0.15)" />
    <text x="324" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ffffff">💳 Quét mã VietQR</text>
  </g>

  <!-- Bottom CTA hint -->
  <text x="40" y="245" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fecdd3">🎟️ Nhập mã ưu đãi: CENTER2026 khi thanh toán đơn hàng</text>

  <!-- Right Visual / Target Badge -->
  <g transform="translate(540, 45)" filter="url(#shadow-promo)">
    <!-- Main Glass Card -->
    <rect x="0" y="0" width="220" height="210" rx="16" fill="rgba(255, 255, 255, 0.95)" />
    
    <!-- Header of Card -->
    <rect x="0" y="0" width="220" height="48" rx="16" fill="#881337" />
    <rect x="0" y="32" width="220" height="16" fill="#881337" />
    <text x="110" y="30" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="1">GIẢM NGAY HỌC PHÍ</text>

    <!-- Center Discount -->
    <circle cx="110" cy="115" r="46" fill="url(#discount-grad)" />
    <circle cx="110" cy="115" r="41" fill="#ffffff" />
    <text x="110" y="108" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#9f1239">OFF</text>
    <text x="110" y="132" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#be123c">30%</text>

    <!-- Card Footer Tags -->
    <rect x="25" y="172" width="170" height="24" rx="12" fill="#fff1f2" />
    <text x="110" y="188" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#e11d48">SỐ LƯỢNG CÓ HẠN</text>
  </g>
</svg>
